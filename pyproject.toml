[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotraffic"
version = "0.1.0"
description = "Top-down traffic simulator where neural networks learn to control traffic lights."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pygame>=2.1", "numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
neurotraffic = "neurotraffic.main:main"
neurotraffic-train = "neurotraffic.train:main"

[tool.setuptools.packages.find]
include = ["neurotraffic*"]

[tool.setuptools.package-data]
neurotraffic = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
